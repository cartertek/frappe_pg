
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-frappe_pg-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app frappe_pg
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server

  postgres-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            label: v15
            python: '3.10'
            node: 18
          - frappe: v16.33.0
            label: v16.33.0
            python: '3.14'
            node: 24
    name: PostgreSQL / Frappe ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Frappe
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Install app and create PostgreSQL site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app frappe_pg
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server


  upstream-postgres-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 1 of 8
            python: '3.10'
            node: 18
            shard: 1
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 2 of 8
            python: '3.10'
            node: 18
            shard: 2
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 3 of 8
            python: '3.10'
            node: 18
            shard: 3
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 4 of 8
            python: '3.10'
            node: 18
            shard: 4
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 5 of 8
            python: '3.10'
            node: 18
            shard: 5
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 6 of 8
            python: '3.10'
            node: 18
            shard: 6
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 7 of 8
            python: '3.10'
            node: 18
            shard: 7
          - frappe: version-15
            app: frappe
            label: Frappe v15 / shard 8 of 8
            python: '3.10'
            node: 18
            shard: 8
          - frappe: version-15
            app: erpnext
            app_branch: version-15
            label: ERPNext v15
            python: '3.10'
            node: 18
          - frappe: version-15
            app: hrms
            app_branch: version-15
            label: HRMS v15
            python: '3.10'
            node: 18
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 1 of 8
            python: '3.14'
            node: 24
            shard: 1
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 2 of 8
            python: '3.14'
            node: 24
            shard: 2
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 3 of 8
            python: '3.14'
            node: 24
            shard: 3
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 4 of 8
            python: '3.14'
            node: 24
            shard: 4
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 5 of 8
            python: '3.14'
            node: 24
            shard: 5
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 6 of 8
            python: '3.14'
            node: 24
            shard: 6
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 7 of 8
            python: '3.14'
            node: 24
            shard: 7
          - frappe: version-16
            app: frappe
            label: Frappe v16 / shard 8 of 8
            python: '3.14'
            node: 24
            shard: 8
          - frappe: version-16
            app: erpnext
            app_branch: version-16
            label: ERPNext v16
            python: '3.14'
            node: 24
          - frappe: version-16
            app: hrms
            app_branch: version-16
            label: HRMS v16
            python: '3.14'
            node: 24
    name: PostgreSQL upstream / ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-upstream-${{ matrix.app }}-${{ matrix.frappe }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-upstream-${{ matrix.app }}-${{ matrix.frappe }}-
            ${{ runner.os }}-upstream-
            ${{ runner.os }}-pip-

      - name: Setup Frappe
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Fetch application dependencies
        if: matrix.app != 'frappe'
        working-directory: /home/runner/frappe-bench
        run: |
          if [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench get-app --branch "${{ matrix.app_branch }}" erpnext https://github.com/frappe/erpnext.git
            bench get-app --branch "${{ matrix.app_branch }}" hrms https://github.com/frappe/hrms.git
          else
            bench get-app --branch "${{ matrix.app_branch }}" erpnext https://github.com/frappe/erpnext.git
          fi

      - name: Create PostgreSQL test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app frappe_pg

          if [[ "${{ matrix.app }}" == "erpnext" ]]; then
            bench --site test_site install-app erpnext
          elif [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench --site test_site install-app erpnext
            bench --site test_site install-app hrms
          fi
        env:
          CI: 'Yes'

      - name: Run upstream application tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            bench --site test_site run-parallel-tests \
              --app frappe \
              --total-builds 8 \
              --build-number "${{ matrix.shard }}"
          else
            bench --site test_site run-tests --app "${{ matrix.app }}"
          fi
        env:
          TYPE: server
