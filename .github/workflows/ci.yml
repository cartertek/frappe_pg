          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install test system dependencies
        if: matrix.test_group == 'remainder-1' || matrix.test_group == 'remainder-2' || matrix.test_group == 'email-account'
        run: |
          wget -q -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/wkhtmltox.deb

      - name: Download prepared Frappe bench
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/prepared-bench

      - name: Restore prepared Frappe bench
        run: |
          tar -C /home/runner -xf "$RUNNER_TEMP/prepared-bench/frappe-bench.tar"
          pip install frappe-bench

      - name: Restore reusable PostgreSQL Frappe fixture
        env:
          PGPASSWORD: root
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE test_frappe LOGIN PASSWORD 'test_frappe';
          CREATE DATABASE test_frappe OWNER test_frappe;
          SQL
          PGPASSWORD=test_frappe pg_restore -h 127.0.0.1 -U test_frappe \
            --dbname test_frappe \
            --no-owner \
            --no-privileges \
            "$RUNNER_TEMP/prepared-bench/test_frappe.dump"

      - name: Start Frappe services
        working-directory: /home/runner/frappe-bench
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          bench start > "$GITHUB_WORKSPACE/bench_start.log" 2>&1 &

          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null http://test_site:8000; then
              exit 0
            fi
            sleep 1
          done

          cat "$GITHUB_WORKSPACE/bench_start.log"
          exit 1

      - name: Run upstream application tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_frappe_test_group.py" \
              --site test_site \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          else
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_app_test_group.py" \
              --site test_site \
              --app "${{ matrix.app }}" \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          fi
        env:
          TYPE: server
          FRAPPE_BENCH_ROOT: /home/runner/frappe-bench

