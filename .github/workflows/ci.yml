name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-frappe_pg-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: PostgreSQL / Frappe v16

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Find tests
        run: grep -rn "def test" frappe_pg/tests > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Frappe v16
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch v16.33.0 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Install app and create PostgreSQL site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app frappe_pg
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server
