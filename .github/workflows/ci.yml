
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-frappe_pg-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app frappe_pg
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server

  postgres-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            label: v15
            python: '3.10'
            node: 18
          - frappe: v16.33.0
            label: v16.33.0
            python: '3.14'
            node: 24
    name: PostgreSQL / Frappe ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Frappe
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Install app and create PostgreSQL site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app frappe_pg
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server


  prepare-upstream-frappe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            label: v15
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
          - frappe: version-16
            label: v16
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
    name: Prepare upstream Frappe ${{ matrix.label }}

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-upstream-prep-${{ matrix.frappe }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-upstream-prep-${{ matrix.frappe }}-
            ${{ runner.os }}-upstream-
            ${{ runner.os }}-pip-

      - name: Prepare Frappe bench
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench
          cd ~/frappe-bench
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench setup requirements --node
          CI=Yes bench build --force --production
        env:
          CI: 'Yes'

      - name: Pack prepared bench
        run: tar -C /home/runner -cf "$RUNNER_TEMP/frappe-bench.tar" frappe-bench

      - name: Upload prepared bench
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/frappe-bench.tar
          compression-level: 0
          retention-days: 1


  upstream-postgres-tests:
    needs: prepare-upstream-frappe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            app: frappe
            label: Frappe v15 / remainder 1
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-1
          - frappe: version-15
            app: frappe
            label: Frappe v15 / remainder 2
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-2
          - frappe: version-15
            app: frappe
            label: Frappe v15 / webhook
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: webhook
          - frappe: version-15
            app: frappe
            label: Frappe v15 / rq
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: rq
          - frappe: version-15
            app: frappe
            label: Frappe v15 / permissions
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: permissions
          - frappe: version-15
            app: frappe
            label: Frappe v15 / db query
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: db-query
          - frappe: version-15
            app: frappe
            label: Frappe v15 / auth
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: auth
          - frappe: version-15
            app: frappe
            label: Frappe v15 / boot
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: boot
          - frappe: version-15
            app: frappe
            label: Frappe v15 / fixture import
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: fixture-import
          - frappe: version-15
            app: frappe
            label: Frappe v15 / email account
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: email-account
          - frappe: version-15
            app: frappe
            label: Frappe v15 / commands
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: commands
          - frappe: version-15
            app: erpnext
            app_branch: version-15
            label: ERPNext v15 / payment reconciliation
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: payment-reconciliation
          - frappe: version-15
            app: erpnext
            app_branch: version-15
            label: ERPNext v15 / remainder 1
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-1
          - frappe: version-15
            app: erpnext
            app_branch: version-15
            label: ERPNext v15 / remainder 2
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-2
          - frappe: version-15
            app: erpnext
            app_branch: version-15
            label: ERPNext v15 / remainder 3
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-3
          - frappe: version-15
            app: hrms
            app_branch: version-15
            label: HRMS v15 / leave heavy
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: leave-heavy
          - frappe: version-15
            app: hrms
            app_branch: version-15
            label: HRMS v15 / payroll heavy
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: payroll-heavy
          - frappe: version-15
            app: hrms
            app_branch: version-15
            label: HRMS v15 / remainder 1
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-1
          - frappe: version-15
            app: hrms
            app_branch: version-15
            label: HRMS v15 / remainder 2
            python: '3.10'
            node: 18
            artifact: frappe-bench-v15
            test_group: remainder-2
          - frappe: version-16
            app: frappe
            label: Frappe v16 / remainder 1
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-1
          - frappe: version-16
            app: frappe
            label: Frappe v16 / remainder 2
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-2
          - frappe: version-16
            app: frappe
            label: Frappe v16 / webhook
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: webhook
          - frappe: version-16
            app: frappe
            label: Frappe v16 / rq
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: rq
          - frappe: version-16
            app: frappe
            label: Frappe v16 / permissions
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: permissions
          - frappe: version-16
            app: frappe
            label: Frappe v16 / db query
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: db-query
          - frappe: version-16
            app: frappe
            label: Frappe v16 / auth
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: auth
          - frappe: version-16
            app: frappe
            label: Frappe v16 / boot
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: boot
          - frappe: version-16
            app: frappe
            label: Frappe v16 / fixture import
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: fixture-import
          - frappe: version-16
            app: frappe
            label: Frappe v16 / email account
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: email-account
          - frappe: version-16
            app: frappe
            label: Frappe v16 / commands
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: commands
          - frappe: version-16
            app: erpnext
            app_branch: version-16
            label: ERPNext v16 / payment reconciliation
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: payment-reconciliation
          - frappe: version-16
            app: erpnext
            app_branch: version-16
            label: ERPNext v16 / remainder 1
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-1
          - frappe: version-16
            app: erpnext
            app_branch: version-16
            label: ERPNext v16 / remainder 2
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-2
          - frappe: version-16
            app: erpnext
            app_branch: version-16
            label: ERPNext v16 / remainder 3
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-3
          - frappe: version-16
            app: hrms
            app_branch: version-16
            label: HRMS v16 / leave heavy
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: leave-heavy
          - frappe: version-16
            app: hrms
            app_branch: version-16
            label: HRMS v16 / payroll heavy
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: payroll-heavy
          - frappe: version-16
            app: hrms
            app_branch: version-16
            label: HRMS v16 / remainder 1
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-1
          - frappe: version-16
            app: hrms
            app_branch: version-16
            label: HRMS v16 / remainder 2
            python: '3.14'
            node: 24
            artifact: frappe-bench-v16
            test_group: remainder-2
    name: PostgreSQL upstream / ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      smtp-server:
        image: rnwood/smtp4dev:3.7.1
        ports:
          - 2525:25
          - 3000:80
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install test system dependencies
        run: |
          wget -q -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/wkhtmltox.deb

      - name: Download prepared Frappe bench
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/prepared-bench

      - name: Restore prepared Frappe bench
        run: |
          tar -C /home/runner -xf "$RUNNER_TEMP/prepared-bench/frappe-bench.tar"
          pip install frappe-bench

      - name: Fetch application dependencies
        if: matrix.app != 'frappe'
        working-directory: /home/runner/frappe-bench
        run: |
          # ERPNext's own upstream test setup includes the Payments app. Several
          # ERPNext test-record dependencies (for example Payment Gateway) live
          # there rather than in ERPNext itself. Match upstream's branch choice.
          if [[ "${{ matrix.frappe }}" == "version-15" ]]; then
            payments_branch=version-15
          else
            payments_branch=develop
          fi
          bench get-app --branch "$payments_branch" payments https://github.com/frappe/payments.git

          if [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench get-app --branch "${{ matrix.app_branch }}" erpnext https://github.com/frappe/erpnext.git
            bench get-app --branch "${{ matrix.app_branch }}" hrms https://github.com/frappe/hrms.git
          else
            bench get-app --branch "${{ matrix.app_branch }}" erpnext https://github.com/frappe/erpnext.git
          fi
          bench setup requirements --dev

      - name: Backport upstream PostgreSQL test fixture fix
        if: matrix.app != 'frappe'
        working-directory: /home/runner/frappe-bench
        run: |
          # ERPNext develop commit c541bc9239 fixes a test-only warehouse-name
          # case mismatch that MariaDB's default collation hides but PostgreSQL
          # correctly rejects. Keep application runtime code untouched and
          # apply the same one-line fixture correction to the tested branches.
          python - <<'PY'
          from pathlib import Path

          candidates = [
              Path("apps/erpnext/erpnext/tests/utils.py"),
              Path("apps/erpnext/erpnext/manufacturing/doctype/workstation/test_records.json"),
          ]
          old = '"warehouse": "_Test warehouse - _TC"'
          new = '"warehouse": "_Test Warehouse - _TC"'
          changed = 0
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              if old not in source:
                  continue
              path.write_text(source.replace(old, new, 1))
              changed += 1
          if changed != 1:
              raise SystemExit(f"expected exactly one ERPNext workstation fixture correction, changed {changed}")
          PY

      - name: Create PostgreSQL test site
        working-directory: /home/runner/frappe-bench
        run: |
          # Frappe's own command tests read these from common_site_config,
          # not from the arguments used to create the primary test site.
          bench set-config root_login postgres -g
          bench set-config root_password root -g
          bench set-config admin_password admin -g
          bench set-config db_type postgres -g

          # Create the site with stock Frappe first. Frappe's before_tests hook
          # intentionally skips setup when another app is already installed.
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-name test_frappe \
            --db-password test_frappe \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin

          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            bench --site test_site execute frappe.utils.install.before_tests
          fi
          bench --site test_site install-app frappe_pg

          if [[ "${{ matrix.app }}" == "erpnext" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
          elif [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
            bench --site test_site install-app hrms
          fi

          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config server_script_enabled 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site set-config auto_email_id "test@example.com"
          bench --site test_site set-config mail_server localhost
          bench --site test_site set-config mail_port 2525 --parse
          bench --site test_site set-config mail_login "test@example.com"
          bench --site test_site set-config mail_password test
          bench --site test_site set-config disable_mail_smtp_authentication 1 --parse

          # ERPNext v16's upstream server-test workflow explicitly warms its
          # bootstrap records before running the suite. Without that pass, later
          # bootstrap records can reference fixtures (for example the _TC
          # warehouse) that have not been created yet. HRMS consumes the same
          # ERPNext test data.
          if [[ "${{ matrix.frappe }}" == "version-16" && "${{ matrix.app }}" != "frappe" ]]; then
            bench --site test_site run-tests --lightmode --module erpnext.tests.bootstrap_test_data
          fi

          # Redis is provided by Actions services. Keep the web and worker
          # processes that upstream Frappe's server-test setup starts.
          sed -i '/^redis_/d; /^watch:/d; /^schedule:/d; /^socketio:/d' Procfile
        env:
          CI: 'Yes'

      - name: Start Frappe services
        working-directory: /home/runner/frappe-bench
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          bench start > "$GITHUB_WORKSPACE/bench_start.log" 2>&1 &

          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null http://test_site:8000; then
              exit 0
            fi
            sleep 1
          done

          cat "$GITHUB_WORKSPACE/bench_start.log"
          exit 1

      - name: Run upstream application tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_frappe_test_group.py" \
              --site test_site \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          else
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_app_test_group.py" \
              --site test_site \
              --app "${{ matrix.app }}" \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          fi
        env:
          TYPE: server
          FRAPPE_BENCH_ROOT: /home/runner/frappe-bench
