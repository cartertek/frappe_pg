          bench set-config db_type postgres -g

          # Create the site with stock Frappe first. Frappe's before_tests hook
          # intentionally skips setup when another app is already installed.
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-name test_frappe \
            --db-password test_frappe \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin

          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            bench --site test_site execute frappe.utils.install.before_tests
          fi
          bench --site test_site install-app frappe_pg

          if [[ "${{ matrix.app }}" == "erpnext" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
          elif [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
            bench --site test_site install-app hrms
          fi

          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config server_script_enabled 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site set-config auto_email_id "test@example.com"
          bench --site test_site set-config mail_server localhost
          bench --site test_site set-config mail_port 2525 --parse
          bench --site test_site set-config mail_login "test@example.com"
          bench --site test_site set-config mail_password test
          bench --site test_site set-config disable_mail_smtp_authentication 1 --parse

          # ERPNext v16's upstream server-test workflow explicitly warms its
          # bootstrap records before running the suite. Without that pass, later
          # bootstrap records can reference fixtures (for example the _TC
          # warehouse) that have not been created yet. HRMS consumes the same
          # ERPNext test data.
          if [[ "${{ matrix.frappe }}" == "version-16" && "${{ matrix.app }}" != "frappe" ]]; then
            bench --site test_site run-tests --lightmode --module erpnext.tests.bootstrap_test_data
          fi

          # Redis is provided by Actions services. Keep the web and worker
          # processes that upstream Frappe's server-test setup starts.
          sed -i '/^redis_/d; /^watch:/d; /^schedule:/d; /^socketio:/d' Procfile
        env:
          CI: 'Yes'

      - name: Restore reusable PostgreSQL app fixture
        if: matrix.app != 'frappe'
        env:
          PGPASSWORD: root
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE test_frappe LOGIN PASSWORD 'test_frappe';
          CREATE DATABASE test_frappe OWNER test_frappe;
          SQL
          PGPASSWORD=test_frappe pg_restore -h 127.0.0.1 -U test_frappe \
            --dbname test_frappe \
            --no-owner \
            --no-privileges \
            "$RUNNER_TEMP/prepared-bench/test_frappe.dump"

      - name: Start Frappe services
        working-directory: /home/runner/frappe-bench
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          bench start > "$GITHUB_WORKSPACE/bench_start.log" 2>&1 &

          for _ in {1..30}; do
            if curl --fail --silent --output /dev/null http://test_site:8000; then
              exit 0
            fi
            sleep 1
          done

          cat "$GITHUB_WORKSPACE/bench_start.log"
          exit 1

      - name: Run upstream application tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_frappe_test_group.py" \
              --site test_site \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          else
            cd sites
            status=0
            ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/run_app_test_group.py" \
              --site test_site \
              --app "${{ matrix.app }}" \
              --group "${{ matrix.test_group }}" || status=$?

            exit "$status"
          fi
        env:
          TYPE: server
          FRAPPE_BENCH_ROOT: /home/runner/frappe-bench
