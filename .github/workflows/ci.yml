  prepare-upstream-erpnext-v15:
    needs: prepare-upstream-frappe-v15
    runs-on: ubuntu-latest
    name: Prepare upstream ERPNext / version-15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Download prepared Frappe bench
        uses: actions/download-artifact@v4
        with:
          name: frappe-bench-v15
          path: ${{ runner.temp }}/prepared-bench

      - name: Restore prepared Frappe bench
        run: |
          tar -C /home/runner -xf "$RUNNER_TEMP/prepared-bench/frappe-bench.tar"
          pip install frappe-bench

      - name: Restore Frappe PostgreSQL database
        working-directory: /home/runner/frappe-bench
        env:
          PGPASSWORD: root
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE test_frappe LOGIN PASSWORD 'test_frappe';
          CREATE DATABASE test_frappe OWNER test_frappe;
          SQL
          PGPASSWORD=test_frappe pg_restore -h 127.0.0.1 -U test_frappe --dbname test_frappe --no-owner --no-privileges "$RUNNER_TEMP/prepared-bench/frappe_base.dump"
          cd sites
          ../env/bin/python - <<'PYVERIFY'
          import frappe

          frappe.init(site="test_site")
          frappe.connect()
          apps = frappe.get_installed_apps()
          assert apps == ["frappe"], apps
          print("Restored neutral Frappe fixture verified:", ", ".join(apps))
          PYVERIFY
          rm -f test_site/.test_records.jsonl
          cd ..
          bench --site test_site install-app frappe_pg
      - name: Fetch application dependencies
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-15 payments https://github.com/frappe/payments.git
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext.git
          bench setup requirements --dev payments erpnext

      - name: Backport upstream PostgreSQL test fixture fix
        working-directory: /home/runner/frappe-bench
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          candidates = [
              Path("apps/erpnext/erpnext/tests/utils.py"),
              Path("apps/erpnext/erpnext/manufacturing/doctype/workstation/test_records.json"),
          ]
          old = '"warehouse": "_Test warehouse - _TC"'
          new = '"warehouse": "_Test Warehouse - _TC"'
          changed = 0
          for path in candidates:
              if path.exists() and old in path.read_text():
                  path.write_text(path.read_text().replace(old, new, 1))
                  changed += 1
          if changed != 1:
              raise SystemExit(f"expected exactly one ERPNext workstation fixture correction, changed {changed}")


          # Inventory Dimension tests create Custom Fields (including Stock Ledger Entry
          # columns) and expect MariaDB's implicit DDL commit semantics. PostgreSQL DDL
          # is transactional, so commit immediately after the test helper inserts a
          # dimension to keep metadata and physical columns in sync across test rollbacks.
          inventory_test = Path("apps/erpnext/erpnext/stock/doctype/inventory_dimension/test_inventory_dimension.py")
          inventory_source = inventory_test.read_text()
          inventory_markers = [
              "\t\tif not args.do_not_save:\n\t\t\tdoc.insert(ignore_permissions=True)\n",
              "\tif not args.do_not_save:\n\t\tdoc.insert(ignore_permissions=True)\n",
          ]
          if "PostgreSQL: match MariaDB DDL implicit-commit test semantics" not in inventory_source:
              for inventory_marker in inventory_markers:
                  if inventory_marker in inventory_source:
                      indent = inventory_marker.split("doc.insert", 1)[0].rsplit("\n", 1)[-1]
                      inventory_replacement = inventory_marker + indent + "frappe.db.commit()  # PostgreSQL: match MariaDB DDL implicit-commit test semantics\n"
                      inventory_test.write_text(inventory_source.replace(inventory_marker, inventory_replacement, 1))
                      break
              else:
                  raise SystemExit("ERPNext inventory-dimension test helper marker not found")

          # ERPNext v15 creates Supplier.pan once in setUpClass and then rolls
          # back after each test. MariaDB's updatedb DDL implicitly commits the
          # class setup; PostgreSQL DDL is transactional, so preserve the
          # upstream MariaDB test state with an explicit commit at the same point.
          tax_test = Path("apps/erpnext/erpnext/accounts/doctype/tax_withholding_category/test_tax_withholding_category.py")
          source = tax_test.read_text()
          marker = "\t\tmake_pan_no_field()\n"
          replacement = marker + "\t\tfrappe.db.commit()  # PostgreSQL: match MariaDB DDL implicit-commit test semantics\n"
          if replacement not in source:
              if marker not in source:
                  raise SystemExit("ERPNext v15 tax-withholding setup marker not found")
              tax_test.write_text(source.replace(marker, replacement, 1))
          PYFIX

      - name: Create reusable PostgreSQL ERPNext fixture
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
          PGPASSWORD: root
        run: |
          bench --site test_site install-app payments
          bench --site test_site install-app erpnext
          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config server_script_enabled 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site set-config auto_email_id "test@example.com"
          bench --site test_site set-config mail_server localhost
          bench --site test_site set-config mail_port 2525 --parse
          bench --site test_site set-config mail_login "test@example.com"
          bench --site test_site set-config mail_password test
          bench --site test_site set-config disable_mail_smtp_authentication 1 --parse
          # Match upstream CI: snapshot ERPNext immediately after app installation.
          # Each shard runs the app's native before_tests/global dependencies (or
          # v16 bootstrap imports) in its own fresh process. Keep the filesystem
          # test-record journal consistent with this installed-only database.
          rm -f sites/test_site/.test_records.jsonl
          pg_dump -h 127.0.0.1 -U postgres -Fc --no-owner --no-acl test_frappe > "$RUNNER_TEMP/erpnext_base.dump"
          sed -i '/^redis_/d; /^watch:/d; /^schedule:/d; /^socketio:/d' Procfile
          cp "$RUNNER_TEMP/erpnext_base.dump" "$RUNNER_TEMP/test_frappe.dump"

      - name: Pack reusable ERPNext fixture
        run: tar -C /home/runner -cf "$RUNNER_TEMP/frappe-bench.tar" frappe-bench

      - name: Upload reusable ERPNext fixture
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-bench-v15
          path: |
            ${{ runner.temp }}/frappe-bench.tar
            ${{ runner.temp }}/erpnext_base.dump
            ${{ runner.temp }}/test_frappe.dump
          compression-level: 6
          retention-days: 1

  prepare-upstream-erpnext-v16:
    needs: prepare-upstream-frappe-v16
    runs-on: ubuntu-latest
    name: Prepare upstream ERPNext / version-16

    services:
