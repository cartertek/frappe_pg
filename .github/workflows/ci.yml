    name: PostgreSQL upstream / ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      smtp-server:
        image: rnwood/smtp4dev:3.7.1
        ports:
          - 2525:25
          - 3000:80
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install test system dependencies
        if: matrix.test_group == 'remainder-1' || matrix.test_group == 'remainder-4' || matrix.test_group == 'remainder-10'
        run: |
          wget -q -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/wkhtmltox.deb

      - name: Download prepared Frappe bench
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/prepared-bench

      - name: Restore prepared Frappe bench
        run: |
          tar -C /home/runner -xf "$RUNNER_TEMP/prepared-bench/frappe-bench.tar"
          pip install frappe-bench

      - name: Create PostgreSQL test site
        if: matrix.app == 'frappe'
        working-directory: /home/runner/frappe-bench
        run: |
          # Frappe's own command tests read these from common_site_config,
          # not from the arguments used to create the primary test site.
          bench set-config root_login postgres -g
          bench set-config root_password root -g
          bench set-config admin_password admin -g
          bench set-config db_type postgres -g

          # Create the site with stock Frappe first. Frappe's before_tests hook
          # intentionally skips setup when another app is already installed.
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-name test_frappe \
            --db-password test_frappe \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin

          if [[ "${{ matrix.app }}" == "frappe" ]]; then
            bench --site test_site execute frappe.utils.install.before_tests
          fi
          bench --site test_site install-app frappe_pg

          if [[ "${{ matrix.app }}" == "erpnext" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
          elif [[ "${{ matrix.app }}" == "hrms" ]]; then
            bench --site test_site install-app payments
            bench --site test_site install-app erpnext
            bench --site test_site install-app hrms
          fi

          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config server_script_enabled 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site set-config auto_email_id "test@example.com"
          bench --site test_site set-config mail_server localhost
          bench --site test_site set-config mail_port 2525 --parse
          bench --site test_site set-config mail_login "test@example.com"
          bench --site test_site set-config mail_password test
          bench --site test_site set-config disable_mail_smtp_authentication 1 --parse

          # ERPNext v16's upstream server-test workflow explicitly warms its
          # bootstrap records before running the suite. Without that pass, later
          # bootstrap records can reference fixtures (for example the _TC
          # warehouse) that have not been created yet. HRMS consumes the same
          # ERPNext test data.
