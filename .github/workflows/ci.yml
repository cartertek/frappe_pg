
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-frappe_pg-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app frappe_pg
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server

  postgres-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            label: v15
            python: '3.10'
            node: 18
          - frappe: v16.33.0
            label: v16.33.0
            python: '3.14'
            node: 24
    name: PostgreSQL / Frappe ${{ matrix.label }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Frappe
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${{ matrix.frappe }}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Install app and create PostgreSQL site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app frappe_pg
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_pg
        env:
          TYPE: server


  prepare-upstream-frappe-v15:
    runs-on: ubuntu-latest
    name: Prepare upstream Frappe v15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-upstream-prep-version-15-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-upstream-prep-version-15-
            ${{ runner.os }}-upstream-
            ${{ runner.os }}-pip-

      - name: Prepare Frappe bench
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "version-15" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench
          cd ~/frappe-bench
          bench get-app frappe_pg "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench setup requirements --node
          CI=Yes bench build --force --production
        env:
          CI: 'Yes'

      - name: Create reusable PostgreSQL Frappe fixture
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
          PGPASSWORD: root
        run: |
          bench set-config root_login postgres -g
          bench set-config root_password root -g
          bench set-config admin_password admin -g
          bench set-config db_type postgres -g
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-name test_frappe \
            --db-password test_frappe \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin
          # Preserve a neutral installed-Frappe database for downstream apps.
          # Frappe's before_tests hook must run while Frappe is the only installed
          # app; otherwise it intentionally skips setup_complete().
          pg_dump -h 127.0.0.1 -U postgres -Fc --no-owner --no-acl test_frappe > "$RUNNER_TEMP/frappe_base.dump"
          cd sites
          ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/prepare_app_test_fixture.py" --site test_site --app frappe
          cd ..
          bench --site test_site install-app frappe_pg
          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config server_script_enabled 1 --parse
          bench --site test_site set-config host_name "http://test_site:8000"
          bench --site test_site set-config auto_email_id "test@example.com"
          bench --site test_site set-config mail_server localhost
          bench --site test_site set-config mail_port 2525 --parse
          bench --site test_site set-config mail_login "test@example.com"
          bench --site test_site set-config mail_password test
          bench --site test_site set-config disable_mail_smtp_authentication 1 --parse
          sed -i '/^redis_/d; /^watch:/d; /^schedule:/d; /^socketio:/d' Procfile
          pg_dump -h 127.0.0.1 -U postgres -Fc --no-owner --no-acl test_frappe > "$RUNNER_TEMP/test_frappe.dump"

      - name: Pack prepared bench
        run: tar -C /home/runner -cf "$RUNNER_TEMP/frappe-bench.tar" frappe-bench

      - name: Upload prepared bench
        uses: actions/upload-artifact@v4
        with:
          name: frappe-bench-v15
          path: |
            ${{ runner.temp }}/frappe-bench.tar
            ${{ runner.temp }}/frappe_base.dump
            ${{ runner.temp }}/test_frappe.dump
          compression-level: 6
          retention-days: 1

