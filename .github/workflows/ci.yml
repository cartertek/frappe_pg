  prepare-upstream-erpnext-v15:
    needs: prepare-upstream-frappe-v15
    runs-on: ubuntu-latest
    name: Prepare upstream ERPNext / version-15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
