          - 11000:6379

    steps:
      - name: Clone
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 24
