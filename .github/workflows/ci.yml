          path: ${{ runner.temp }}/prepared-bench
      - name: Restore reusable ERPNext fixture
        run: |
          tar -C /home/runner -xf "$RUNNER_TEMP/prepared-bench/frappe-bench.tar"
          pip install frappe-bench
      - name: Restore ERPNext PostgreSQL database
        env:
          PGPASSWORD: root
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE test_frappe LOGIN PASSWORD 'test_frappe';
          CREATE DATABASE test_frappe OWNER test_frappe;
          SQL
          PGPASSWORD=test_frappe pg_restore -h 127.0.0.1 -U test_frappe --dbname test_frappe --no-owner --no-privileges "$RUNNER_TEMP/prepared-bench/erpnext_base.dump"
          rm -f /home/runner/frappe-bench/sites/test_site/.test_records.jsonl
          cd /home/runner/frappe-bench/sites
          ../env/bin/python - <<'PYBASE'
          import frappe
          frappe.init(site="test_site")
          frappe.connect()
          print("HRMS base default company before HRMS test setup:", frappe.db.get_single_value("Global Defaults", "default_company"))
          print("HRMS base companies:", frappe.get_all("Company", pluck="name"))
          PYBASE
      - name: Add HRMS to reusable fixture
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
          PGPASSWORD: root
        run: |
          bench get-app --branch "version-16" hrms https://github.com/frappe/hrms.git
          bench setup requirements --dev hrms
          python - <<'PYFIX'
          from pathlib import Path

          # HRMS tests compare rows returned without a portable ordering contract.
          # MariaDB and PostgreSQL collate generated names differently, so assert
          # the same business values by identity / after a deterministic Python sort.
          bssa = Path("apps/hrms/hrms/payroll/doctype/bulk_salary_structure_assignment/test_bulk_salary_structure_assignment.py")
          source = bssa.read_text()
          old = "\t\t# employee grade default base pay fetched\n\t\tself.assertEqual(employees[0].base, self.grade.default_base_pay)\n\t\t# no employee grade\n\t\tself.assertEqual(employees[1].base, 0)\n"
          new = "\t\temployees_by_id = {row.employee: row for row in employees}\n\t\t# employee grade default base pay fetched\n\t\tself.assertEqual(employees_by_id[self.emp1].base, self.grade.default_base_pay)\n\t\t# no employee grade\n\t\tself.assertEqual(employees_by_id[self.emp3].base, 0)\n"
          if new not in source:
              if old not in source:
                  raise SystemExit("HRMS BSSA ordering assertion marker not found")
              bssa.write_text(source.replace(old, new, 1))

          payroll = Path("apps/hrms/hrms/payroll/doctype/payroll_entry/test_payroll_entry.py")
          source = payroll.read_text()
          old = "\t\tself.assertEqual(je_entries, expected_je)\n"
          new = "\t\tself.assertEqual(sorted(je_entries), sorted(expected_je))\n"
          if new not in source:
              if old not in source:
                  raise SystemExit("HRMS payroll JE ordering assertion marker not found")
              source = source.replace(old, new, 1)
          old = "\t\tself.assertEqual(debit_entries, expected_entries)\n"
          new = "\t\tkey = lambda row: tuple(str(row.get(field)) for field in (\"party\", \"account\", \"cost_center\", \"debit\", \"credit\"))\n\t\tself.assertEqual(sorted(debit_entries, key=key), sorted(expected_entries, key=key))\n"
          if new not in source:
              if old not in source:
                  raise SystemExit("HRMS payroll bank-entry ordering assertion marker not found")
              source = source.replace(old, new, 1)
          payroll.write_text(source)

          ctc = Path("apps/hrms/hrms/payroll/report/employee_ctc_break_up/test_employee_ctc_breakup.py")
          source = ctc.read_text()
          old = "\t\t\tself.assertEqual(ctc_breakup.format_currency(ctc_breakup.ctc), data[\"annual_ctc\"])\n"
          new = "\t\t\tself.assertEqual(ctc_breakup.format_currency(ctc_breakup.ctc), fmt_money(data[\"ctc\"], precision=2, currency=data[\"currency\"]))\n"
          if new not in source:
              if old not in source:
                  raise SystemExit("HRMS CTC currency-format assertion marker not found")
              if "from frappe.utils import fmt_money" not in source:
                  source = source.replace("from frappe.utils import", "from frappe.utils import fmt_money,", 1)
              ctc.write_text(source.replace(old, new, 1))
          PYFIX
          bench --site test_site install-app hrms
          cd sites
          ../env/bin/python "$GITHUB_WORKSPACE/.github/scripts/prepare_app_test_fixture.py" --site test_site --app hrms
          cd ..
          pg_dump -h 127.0.0.1 -U postgres -Fc --no-owner --no-acl test_frappe > "$RUNNER_TEMP/test_frappe.dump"
      - name: Pack reusable HRMS fixture
        run: tar -C /home/runner -cf "$RUNNER_TEMP/frappe-bench.tar" frappe-bench
      - name: Upload reusable HRMS fixture
        uses: actions/upload-artifact@v4
        with:
          name: hrms-bench-v16
          path: |
            ${{ runner.temp }}/frappe-bench.tar
            ${{ runner.temp }}/test_frappe.dump
          compression-level: 6
          retention-days: 1

